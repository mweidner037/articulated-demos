<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Folder Tree</title>
    <style>
      .actions {
        margin-left: 8px;
      }

      #toolbar {
        margin: 8px 0;
      }

      #tree-container {
        background: white;
        padding: 8px 0;
        border-radius: 4px;
        border: 2px solid rgba(0, 0, 0, 0.2);
        min-height: 200px;
      }
    </style>
  </head>
  <body>
    <div id="connection-status">
      <label>
        <input type="checkbox" id="connected-checkbox" checked />
        <span id="status-text">Connected</span>
      </label>
    </div>

    <div id="toolbar">
      <button id="new-folder-btn" title="New folder">📁 +</button>
      <button id="new-file-btn" title="New file">📄 +</button>
    </div>

    <div id="tree-container">
      <div id="tree"></div>
    </div>

    <script type="module" src="/main.ts"></script>
  </body>
</html>
